<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoApi — Profesyonel Restoran Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-6 py-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <span class="text-xl">🍽️</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">RestoApi Pro</h1>
                    <p class="text-xs text-slate-400">Gelişmiş Restoran & Otomasyon Paneli</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-700/50 px-3 py-1.5 rounded-full border border-slate-600">
                <span class="h-2.5 w-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs font-medium text-emerald-300">Canlı Sistem</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 space-y-8">

        <!-- 1. İSTATİSTİK KARTLARI (DASHBOARD SUMMARY) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800/60 border border-slate-700/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Günlük Toplam Ciro</p>
                    <h3 id="stat-revenue" class="text-2xl font-bold text-emerald-400 mt-1">₺0.00</h3>
                </div>
                <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 text-emerald-400 text-xl">💰</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Aktif Siparişler</p>
                    <h3 id="stat-orders" class="text-2xl font-bold text-amber-400 mt-1">0</h3>
                </div>
                <div class="bg-amber-500/10 p-3 rounded-xl border border-amber-500/20 text-amber-400 text-xl">🧾</div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/80 p-5 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Masa Doluluk Oranı</p>
                    <h3 id="stat-occupancy" class="text-2xl font-bold text-indigo-400 mt-1">%0</h3>
                </div>
                <div class="bg-indigo-500/10 p-3 rounded-xl border border-indigo-500/20 text-indigo-400 text-xl">🪑</div>
            </div>
        </div>

        <!-- 2. ANA İŞLEM PANELLERİ -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- MASALAR -->
            <section class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h2 class="text-base font-semibold text-white">🪑 Masalar & Hesaplar</h2>
                    <span id="table-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-medium">0 Masa</span>
                </div>
                
                <form id="table-form" class="space-y-2.5 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="table-number" placeholder="Masa No" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        <input type="number" id="table-capacity" placeholder="Kapasite" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-1.5 rounded-lg text-xs transition duration-200">+ Masa Ekle</button>
                </form>

                <div id="table-list" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1"></div>
            </section>

            <!-- MENÜ -->
            <section class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h2 class="text-base font-semibold text-white">🍔 Menü Yönetimi</h2>
                    <span id="product-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-medium">0 Ürün</span>
                </div>

                <form id="product-form" class="space-y-2.5 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <input type="text" id="product-name" placeholder="Ürün Adı" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="0.01" id="product-price" placeholder="Fiyat (₺)" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        <input type="number" id="product-category" placeholder="Kategori ID" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1.5 rounded-lg text-xs transition duration-200">+ Ürün Ekle</button>
                </form>

                <div id="product-list" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1"></div>
            </section>

            <!-- SİPARİŞLER -->
            <section class="bg-slate-800 border border-slate-700/80 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h2 class="text-base font-semibold text-white">🧾 Siparişler</h2>
                    <span id="order-count" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300 font-medium">0 Sipariş</span>
                </div>

                <form id="order-form" class="space-y-2.5 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="order-table-id" placeholder="Masa ID" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        <input type="number" id="order-product-id" placeholder="Ürün ID" required class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <input type="number" id="order-quantity" placeholder="Adet" value="1" min="1" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-1.5 rounded-lg text-xs transition duration-200">⚡ Sipariş Ver</button>
                </form>

                <div id="order-list" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1"></div>
            </section>

        </div>

    </main>

    <!-- JavaScript İşlevselliği -->
    <script>
        async function fetchAllData() {
            try {
                // 1. Masalar
                const tRes = await fetch('/api/tables');
                const tData = await tRes.json();
                const tableList = document.getElementById('table-list');
                document.getElementById('table-count').innerText = `${tData.data.length} Masa`;
                tableList.innerHTML = '';
                
                let occupiedCount = 0;
                tData.data.forEach(t => {
                    const isOccupied = t.status === 'occupied';
                    if (isOccupied) occupiedCount++;
                    
                    tableList.innerHTML += `
                        <div class="flex items-center justify-between p-3 rounded-xl border ${isOccupied ? 'bg-rose-950/20 border-rose-800/40' : 'bg-emerald-950/20 border-emerald-800/40'}">
                            <div>
                                <h4 class="font-semibold text-sm text-white">Masa #${t.tableNumber}</h4>
                                <p class="text-[11px] text-slate-400">Kapasite: ${t.capacity} | <span class="uppercase font-bold">${t.status}</span></p>
                            </div>
                            ${isOccupied ? `
                                <button onclick="resetTable(${t.id})" class="bg-rose-600 hover:bg-rose-500 text-white text-[10px] px-2.5 py-1 rounded-lg font-medium transition">
                                    Hesabı Kapat
                                </button>
                            ` : `<span class="text-xs text-emerald-400 font-medium">Boş</span>`}
                        </div>
                    `;
                });

                // Masa Doluluk Oranı Hesaplama
                const occupancyRate = tData.data.length > 0 ? Math.round((occupiedCount / tData.data.length) * 100) : 0;
                document.getElementById('stat-occupancy').innerText = `%${occupancyRate}`;

                // 2. Ürünler
                const pRes = await fetch('/api/products');
                const pData = await pRes.json();
                const productList = document.getElementById('product-list');
                document.getElementById('product-count').innerText = `${pData.data.length} Ürün`;
                productList.innerHTML = '';

                pData.data.forEach(p => {
                    productList.innerHTML += `
                        <div class="flex items-center justify-between p-3 rounded-xl border border-slate-700/60 bg-slate-900/30">
                            <div>
                                <h4 class="font-semibold text-sm text-white">${p.name}</h4>
                                <p class="text-[11px] text-slate-400">ID: ${p.id} | Kat: ${p.categoryId}</p>
                            </div>
                            <span class="text-sm font-bold text-emerald-400">₺${p.price.toFixed(2)}</span>
                        </div>
                    `;
                });

                // 3. Siparişler & Toplam Ciro Hesaplama
                const oRes = await fetch('/api/orders');
                const oData = await oRes.json();
                const orderList = document.getElementById('order-list');
                document.getElementById('order-count').innerText = `${oData.data.length} Sipariş`;
                orderList.innerHTML = '';

                let totalRevenue = 0;
                let activeOrdersCount = 0;

                oData.data.forEach(o => {
                    if (o.status !== 'cancelled') {
                        totalRevenue += o.totalAmount;
                    }
                    if (o.status === 'pending' || o.status === 'preparing') {
                        activeOrdersCount++;
                    }

                    const itemsText = o.items.map(i => `${i.quantity}x ${i.name}`).join(', ');
                    
                    orderList.innerHTML += `
                        <div class="p-3 rounded-xl border border-amber-500/30 bg-amber-950/10 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-xs text-white">Sipariş #${o.id} <span class="text-slate-400">(Masa ${o.tableId})</span></span>
                                <span class="text-[10px] font-bold uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full">${o.status}</span>
                            </div>
                            <p class="text-xs text-slate-300">${itemsText}</p>
                            <div class="flex justify-between items-center pt-1 border-t border-slate-800">
                                <span class="text-xs font-bold text-amber-400">₺${o.totalAmount.toFixed(2)}</span>
                                <div class="space-x-1">
                                    <button onclick="updateStatus(${o.id}, 'preparing')" class="text-[10px] bg-blue-600 hover:bg-blue-500 px-2 py-0.5 rounded text-white">Hazırlanıyor</button>
                                    <button onclick="updateStatus(${o.id}, 'completed')" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 px-2 py-0.5 rounded text-white">Tamamla</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('stat-revenue').innerText = `₺${totalRevenue.toFixed(2)}`;
                document.getElementById('stat-orders').innerText = activeOrdersCount;

            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        // Aksiyon Fonksiyonları
        async function resetTable(tableId) {
            await fetch(`/api/tables/${tableId}/reset`, { method: 'PUT' });
            fetchAllData();
        }

        async function updateStatus(orderId, newStatus) {
            await fetch(`/api/orders/${orderId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchAllData();
        }

        // Form Gönderimleri
        document.getElementById('table-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tableNumber: Number(document.getElementById('table-number').value), capacity: Number(document.getElementById('table-capacity').value) })
            });
            e.target.reset();
            fetchAllData();
        });

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: document.getElementById('product-name').value, price: Number(document.getElementById('product-price').value), categoryId: Number(document.getElementById('product-category').value), isAvailable: true })
            });
            e.target.reset();
            fetchAllData();
        });

        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tableId: Number(document.getElementById('order-table-id').value),
                    items: [{ productId: Number(document.getElementById('order-product-id').value), quantity: Number(document.getElementById('order-quantity').value) }]
                })
            });
            e.target.reset();
            fetchAllData();
        });

        fetchAllData();
        setInterval(fetchAllData, 4000);
    </script>
</body>
</html>
